name: CI

on:
  push:
  pull_request:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 模型几何自检
        run: node tools/check-models.mjs
      - name: 切割表完整性校验
        run: node tools/check-calibration.mjs
      - name: 切割单元测试（水密/守恒，636 项）
        run: node test/run-tests.mjs
      - name: 进度/成就逻辑（40 项）
        run: node test/progress-tests.mjs
      - name: 结构回归基线（88 组合）
        run: node test/regression.mjs
